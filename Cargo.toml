[package]
name = "horizon-meteor-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Meteor Client modules, settings and commands as a native Horizon mod"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/meteor_client/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
